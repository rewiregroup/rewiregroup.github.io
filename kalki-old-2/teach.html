<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Become a Teacher — Kalki Corporation</title>
<link rel="icon" type="image/x-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Carlito', sans-serif;
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    padding: 2rem 1rem 3rem;
  }

  /* Ambient glows */
  .orb { position: fixed; border-radius: 50%; pointer-events: none; }
  .orb-1 { width: 600px; height: 600px; top: 50%; left: 50%; transform: translate(-50%,-50%); filter: blur(120px); background: hsl(270 60% 52% / 0.12); }
  .orb-2 { width: 300px; height: 300px; top: 25%; left: 25%; filter: blur(100px); background: hsl(42 92% 45% / 0.08); }
  .orb-3 { width: 250px; height: 250px; bottom: 25%; right: 25%; filter: blur(80px); background: hsl(270 60% 52% / 0.06); }

  /* Grid */
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.04;
    background-image: linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 80px 80px;
  }

  /* Container */
  .container {
    position: relative; z-index: 10;
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; align-items: center;
    animation: fadeIn 1s ease-out;
  }

  /* Back button */
  .back-btn {
    align-self: flex-start;
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.4);
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    font-family: inherit; margin-bottom: 1.5rem;
    transition: color 0.3s;
    animation: slideRight 0.5s ease-out 0.2s both;
  }
  .back-btn:hover { color: rgba(255,255,255,0.85); }
  .back-btn:hover .arrow { transform: translateX(-3px); }
  .arrow { transition: transform 0.3s; display: inline-block; }

  /* Logo */
  .logo-wrap {
    position: relative; margin-bottom: 1.5rem;
    animation: scaleIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.3s both;
  }
  .logo-glow { position: absolute; inset: 0; border-radius: 50%; filter: blur(40px); transform: scale(1.5); background: hsl(270 60% 52% / 0.12); animation: pulse 3s ease-in-out infinite; }
  .logo-ring { position: absolute; inset: -4px; border-radius: 50%; filter: blur(8px); background: linear-gradient(135deg, hsl(270 60% 52% / 0.2), transparent, hsl(42 92% 45% / 0.15)); }
  .logo-circle {
    position: relative; width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    box-shadow: 0 0 30px -8px hsl(270 60% 52% / 0.2);
  }
  .logo-circle img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }

  /* Title */
  .title {
    font-size: 1.15rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
    color: rgba(255,255,255,0.9); margin-bottom: 4px; text-align: center;
    animation: slideUp 0.6s ease-out 0.5s both;
  }
  .divider {
    height: 1px; width: 64px; margin: 0 auto 2rem;
    background: linear-gradient(90deg, transparent, hsl(270 60% 52% / 0.5), transparent);
    animation: slideUp 0.6s ease-out 0.7s both;
  }

  /* Form */
  form {
    width: 100%; display: flex; flex-direction: column; gap: 1.25rem;
    animation: slideUp 0.7s ease-out 0.8s both;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label {
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500;
    color: rgba(255,255,255,0.45);
  }
  input, textarea {
    width: 100%; border-radius: 8px; padding: 12px 16px;
    font-size: 14px; font-family: inherit; outline: none;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.88);
    backdrop-filter: blur(4px);
    transition: border-color 0.3s, box-shadow 0.3s;
    resize: none;
  }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
  input:focus, textarea:focus {
    border-color: hsl(270 60% 52% / 0.4);
    box-shadow: 0 0 20px -8px hsl(270 60% 52% / 0.15);
  }

  /* Submit */
  .submit-btn {
    margin-top: 1rem; width: 100%; padding: 14px; border-radius: 8px;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600;
    font-family: inherit; cursor: pointer;
    background: linear-gradient(135deg, hsl(270 60% 52% / 0.3), hsl(270 60% 52% / 0.15));
    border: 1px solid hsl(270 60% 52% / 0.3);
    color: rgba(255,255,255,0.85);
    box-shadow: 0 0 30px -10px hsl(270 60% 52% / 0.2);
    transition: 'background' 0.5s, box-shadow 0.5s;
  }
  .submit-btn:hover {
    background: linear-gradient(135deg, hsl(270 60% 52% / 0.45), hsl(270 60% 52% / 0.25));
    box-shadow: 0 0 40px -8px hsl(270 60% 52% / 0.35);
  }

  /* Success */
  .success { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-top: 1rem; animation: fadeIn 0.6s ease-out; }
  .check-circle {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: hsl(270 60% 52% / 0.15);
    border: 1px solid hsl(270 60% 52% / 0.3);
    font-size: 1.5rem; color: rgba(255,255,255,0.85);
  }
  .success p { font-size: 14px; letter-spacing: 0.03em; color: rgba(255,255,255,0.7); }
  .home-btn {
    margin-top: 0.5rem; padding: 8px 20px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    font-family: inherit; cursor: pointer;
    background: none;
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.3s;
  }
  .home-btn:hover { border-color: hsl(270 60% 52% / 0.4); color: rgba(255,255,255,0.8); }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideRight { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* Responsive */
  @media (min-width: 640px) {
    body { padding: 3rem 1rem 4rem; }
    .logo-circle { width: 80px; height: 80px; }
    .logo-circle img { width: 64px; height: 64px; }
    .title { font-size: 1.3rem; }
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-bg"></div>

  <div class="container">
    <button class="back-btn" onclick="history.back()">
      <span class="arrow">←</span> Back
    </button>

    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="logo-ring"></div>
      <div class="logo-circle">
        <img src="kalki_logo.jpg" alt="Kalki Corporation" />
      </div>
    </div>

    <h1 class="title">Become a Teacher</h1>
    <div class="divider"></div>

    <form id="teachForm">
      <div class="field">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required />
      </div>
      <div class="field">
        <label>Hometown</label>
        <input type="text" placeholder="Where are you from?" required />
      </div>
      <div class="field">
        <label>What do you want to teach?</label>
        <input type="text" placeholder="e.g. Mathematics, Web Development…" required />
      </div>
      <div class="field">
        <label>Domain Experience</label>
        <textarea rows="3" placeholder="Describe your experience in this field" required></textarea>
      </div>
      <div class="field">
        <label>Why do you want to teach?</label>
        <textarea rows="3" placeholder="Tell us your motivation…" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit Application</button>
    </form>

    <div class="success" id="successMsg" style="display:none;">
      <div class="check-circle">✓</div>
      <p>Thank you! Your application has been submitted.</p>
      <button class="home-btn" onclick="location.href='index.html'">Back to Home</button>
    </div>
  </div>

  <script>
    document.getElementById('teachForm').addEventListener('submit', function(e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('successMsg').style.display = 'flex';
    });
  </script>
</body>
</html>
